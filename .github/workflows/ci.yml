name: CI

# Só em pull request e disparo manual, para poupar os minutos do plano do GitHub.
# Execuções antigas do mesmo PR são canceladas.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Testes e sintaxe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Testes
        run: python3 -m unittest discover -s tests -v

      - name: Sintaxe dos scripts
        run: python3 -m py_compile serve-dashboard.py hermes_state_bridge.py && bash -n analyze-session.sh && bash -n claude-tracker.sh
